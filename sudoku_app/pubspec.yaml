name: sudoku_app
description: A cross-platform Sudoku puzzle game.
publish_to: 'none'
version: 1.0.1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  shared_preferences: ^2.2.0
  flutter_acrylic: ^1.1.4
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.24.0
  isar_generator: ^3.1.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/
    - assets/icons/
